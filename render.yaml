services:
  # ── バックエンド (FastAPI) ──────────────────────────────
  - type: web
    name: digital-memorial-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./memorial.db
      - key: BASE_URL
        value: https://digital-memorial-api.onrender.com
      - key: CORS_ORIGINS
        value: https://digital-memorial.onrender.com

  # ── フロントエンド (React Static Site) ────────────────────
  - type: static
    name: digital-memorial
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://digital-memorial-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
